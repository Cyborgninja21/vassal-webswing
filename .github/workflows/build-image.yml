name: build-image

on:
  push:
    branches: [main]
    paths:
      - "docker/**"
      - "src/**"
      - "patches/**"
      - "phase0/skel/**"
      - "phase0/vassal-java"
      - ".github/workflows/build-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: set-up-buildx
        uses: docker/setup-buildx-action@v3

      - name: login-ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build-and-push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ghcr.io/cyborgninja21/vassal-webswing:latest
            ghcr.io/cyborgninja21/vassal-webswing:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
